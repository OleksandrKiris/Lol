<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LOL</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 {
      margin: 10px 0 8px;
      color: #fff;
      font-size: clamp(32px, 6vw, 64px);
      line-height: 1;
    }
    img {
      display: block;
      width: 100%;
      height: calc(100vh - 78px);
      object-fit: contain;
      object-position: center;
    }
  </style>
</head>
<body>
  <h1>LOL</h1>
  <img src="https://i.pinimg.com/originals/2f/dc/3e/2fdc3e8077a2024240236b53fd21e36c.jpg?nii=t" alt="Gorilla">
</body>
</html>
